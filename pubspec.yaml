name: request
description: "Заявки на материалы: подбор материала из справочника и количество на одном экране."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Адреса без «#» в браузере — см. usePathUrlStrategy в main.
  flutter_web_plugins:
    sdk: flutter
  # Дизайн-система живёт отдельным пакетом: она не знает ни про фичи,
  # ни про сеть, и собирается/смотрится независимо от приложения.
  request_ui:
    path: packages/request_ui
  # Даты и склонения — только через intl. Рукописные таблицы месяцев
  # ломаются на первой же смене локали.
  intl: any
  # Типизированные маршруты: deep link на заявку должен открываться без
  # редиректов, а имена маршрутов — проверяться компилятором.
  go_router: ^18.0.1
  # Локальное хранилище: справочник и заявки обязаны пережить перезапуск.
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  # Сборка PDF. Верхняя граница не от осторожности: pdf 3.13 требует xml 7,
  # а excel — xml 6, и вместе они не разрешаются. Поднимать pdf можно будет,
  # когда excel догонит.
  pdf: '>=3.11.0 <3.13.0'
  # Только ради Printing.raster — страницы PDF картинками для предпросмотра.
  # Граница следует за pdf: printing 5.15 требует pdf 3.13.
  printing: '>=5.13.0 <5.15.0'
  # Книга Excel: у снабженца заявка попадает в таблицу, где по колонке
  # количества считают сумму.
  excel: ^4.0.6
  # Системный лист отправки: один путь и для таблицы, и для PDF.
  share_plus: ^13.3.0
  # Каталоги устройства. Приезжает транзитивно с drift_flutter, но мы
  # пользуемся им напрямую.
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  archive: ^3.6.1
  # Настройки (язык интерфейса): пара значений, читаемых до первого кадра,
  # не стоит таблицы и миграции в базе.
  shared_preferences: ^2.5.5
  # Скачивание файла в браузере: «сохранить на устройство» там — это загрузка.
  # Уже приезжал транзитивно с share_plus; прямая зависимость — потому что
  # пользуемся им сами.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.5.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  # Иконки запуска для Android и iOS генерируются из одного PNG,
  # чтобы не держать в репозитории два десятка ресайзов вручную.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# Один исходник 1024x1024 -> все размеры иконок обеих платформ.
# Перегенерация: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/logo/logo.png
  android: true
  ios: true
  # iOS не принимает иконку с альфа-каналом: App Store отклоняет сборку.
  remove_alpha_ios: true
  # Фон совпадает с фоном самого логотипа, поэтому уменьшенный
  # передний слой стыкуется с подложкой без видимого шва.
  adaptive_icon_background: "#EEF2FF"
  adaptive_icon_foreground: assets/logo/logo.png
  # Логотип нарисован почти во всю плашку: рисунок занимает 63% ширины
  # исходника. У адаптивной иконки гарантированно видна только вписанная
  # окружность 72dp из 108dp, а диагональ папки — 0.857 от стороны слоя.
  # Отступ 12% с каждой стороны оставляет слою 82dp, диагональ рисунка
  # выходит 71dp и круглая маска не срезает углы папки.
  adaptive_icon_foreground_inset: 12
