# Веб-версия на GitHub Pages: https://<owner>.github.io/<repo>/
#
# Один раз в настройках репозитория: Settings → Pages → Source: GitHub Actions.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Одна выкладка за раз: две параллельные могли бы лечь в обратном порядке,
# и на сайте осталась бы старая сборка. Начатую не отменяем — пусть доедет.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия та же, что у разработчика: сборка другим Flutter — это
      # другой сайт, чем тот, что проверяли локально.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - run: flutter pub get

      # Сайт лежит не в корне домена, а в /<repo>/ — без этого base href
      # приложение ищет свои файлы в корне и открывается белым экраном.
      # Репозиторий <owner>.github.io — исключение: он и есть корень.
      - name: Build
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then base="/"; else base="/$repo/"; fi
          flutter build web --release --no-wasm-dry-run --base-href "$base"

      # Адреса без «#» (/requests/detail/7): Pages не умеет отдавать
      # index.html на любой путь, зато на неизвестный отдаёт 404.html.
      # Копия index.html под этим именем открывает приложение по прямой
      # ссылке и после обновления страницы.
      - name: SPA fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
